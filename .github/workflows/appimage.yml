name: Build & Release SnapMark (AppImage + DEB)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Test, build and smoke-test x86_64 packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag against source version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          from snapmark import __version__
          assert os.environ['RELEASE_TAG'] == f'v{__version__}', (
              f"Tag {os.environ['RELEASE_TAG']} differs from v{__version__}")
          PY

      - name: Install GTK4, packaging and smoke-test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-cairo python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 libgtk-4-1 libadwaita-1-0 \
            gobject-introspection libgdk-pixbuf2.0-bin \
            xvfb dbus-x11 curl file desktop-file-utils \
            librsvg2-2 librsvg2-common dpkg-dev

      - name: Verify shared GTK assets
        run: |
          test -r /usr/lib/x86_64-linux-gnu/librsvg-2.so.2
          test -r /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-svg.so
          ldd /usr/lib/x86_64-linux-gnu/librsvg-2.so.2 | tee /tmp/snapmark-librsvg-ldd.txt
          ! grep -q 'not found' /tmp/snapmark-librsvg-ldd.txt

      - name: Python regression tests and desktop metadata
        run: |
          /usr/bin/python3 -m compileall -q snapmark tests scripts
          /usr/bin/python3 -m unittest discover -s tests -v
          desktop-file-validate assets/io.github.yanjingchen.SnapMark.desktop
          bash -n scripts/AppRun scripts/build-deb.sh scripts/build-appimage.sh
          /usr/bin/python3 scripts/test-packaging.py -v

      - name: Native GTK GUI smoke-test (Xvfb, not Wayland acceptance)
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 35 \
            /usr/bin/python3 -m snapmark.app --smoke-test

      - name: Build native DEB
        run: bash scripts/build-deb.sh

      - name: Validate DEB control, payload and installed-source launch
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | tee dist/deb-files-checked.txt
          /usr/bin/python3 scripts/test-packaging.py -v
          mkdir -p build/deb-test-root
          dpkg-deb -x dist/*.deb build/deb-test-root
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 35 \
            env PYTHONPATH="$PWD/build/deb-test-root/usr/share/snapmark" \
            /usr/bin/python3 -m snapmark.app --smoke-test

      - name: Build portable AppImage (bundled fallback + host GTK mode)
        run: bash scripts/build-appimage.sh

      - name: Smoke-test AppImage with native system GTK (Xvfb)
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          SNAPMARK_APPIMAGE_GTK_MODE: system
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 60 \
            ./dist/SnapMark-*-x86_64.AppImage --smoke-test

      - name: Smoke-test bundled AppImage fallback (Xvfb)
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          SNAPMARK_APPIMAGE_GTK_MODE: bundled
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 60 \
            ./dist/SnapMark-*-x86_64.AppImage --smoke-test

      - name: Package complete source and SHA256 checksums
        run: |
          /usr/bin/python3 scripts/make-source-archive.py
          cd dist
          sha256sum SnapMark-*-x86_64.AppImage snapmark_*.deb SnapMark-*-Full-Source.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload four verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: SnapMark-x86_64-all-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-Full-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish version-tagged GitHub Release
    needs: packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: SnapMark-x86_64-all-packages
          path: dist

      - name: Validate downloaded release assets and SHA256
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*-Full-Source.zip' | wc -l)" -eq 1
          sha256sum -c SHA256SUMS.txt

      - name: Publish AppImage, DEB, source and checksums
        uses: softprops/action-gh-release@v2
        with:
          name: SnapMark ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*-Full-Source.zip
            dist/SHA256SUMS.txt
