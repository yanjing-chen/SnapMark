name: Build & Release SnapMark AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Test & build x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          /usr/bin/python3 - <<'PYVALIDATE'
          import os
          from snapmark import __version__
          expected = f'v{__version__}'
          assert os.environ['RELEASE_TAG'] == expected, (
              f"Tag {os.environ['RELEASE_TAG']!r} must match {expected!r}")
          print(f'Validated release tag: {expected}')
          PYVALIDATE

      - name: Install GTK4, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-cairo python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 libgtk-4-1 libadwaita-1-0 \
            gobject-introspection libgdk-pixbuf2.0-bin \
            xvfb dbus-x11 curl file desktop-file-utils \
            librsvg2-2 librsvg2-common

      - name: Verify SVG libraries
        run: |
          test -r /usr/lib/x86_64-linux-gnu/librsvg-2.so.2
          test -r /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-svg.so
          ldd /usr/lib/x86_64-linux-gnu/librsvg-2.so.2 | tee /tmp/snapmark-librsvg-ldd.txt
          ! grep -q 'not found' /tmp/snapmark-librsvg-ldd.txt

      - name: Python tests and desktop metadata
        run: |
          /usr/bin/python3 -m compileall -q snapmark tests
          /usr/bin/python3 -m unittest discover -s tests -v
          desktop-file-validate assets/io.github.yanjingchen.SnapMark.desktop

      - name: GTK GUI smoke test (Xvfb, not GNOME Wayland acceptance)
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 35 /usr/bin/python3 -m snapmark.app --smoke-test

      - name: Build AppImage only
        run: bash scripts/build-appimage.sh

      - name: AppImage startup smoke test
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          test -s ./dist/SnapMark-1.1.0-x86_64.AppImage
          xvfb-run -a -s '-screen 0 1440x900x24' \
            dbus-run-session -- timeout 60 \
            ./dist/SnapMark-1.1.0-x86_64.AppImage --smoke-test

      - name: Package full source and checksums
        run: |
          /usr/bin/python3 scripts/make-source-archive.py
          cd dist
          sha256sum SnapMark-1.1.0-x86_64.AppImage SnapMark-1.1.0-Full-Source.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload verified build assets
        uses: actions/upload-artifact@v4
        with:
          name: SnapMark-1.1.0-x86_64
          path: |
            dist/SnapMark-1.1.0-x86_64.AppImage
            dist/SnapMark-1.1.0-Full-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish tagged GitHub Release
    needs: appimage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download verified AppImage and source
        uses: actions/download-artifact@v4
        with:
          name: SnapMark-1.1.0-x86_64
          path: dist

      - name: Verify uploaded checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          name: SnapMark v1.1.0
          body_path: RELEASE_NOTES_v1.1.0.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/SnapMark-1.1.0-x86_64.AppImage
            dist/SnapMark-1.1.0-Full-Source.zip
            dist/SHA256SUMS.txt
