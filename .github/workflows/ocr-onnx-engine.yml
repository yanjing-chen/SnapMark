name: Build SnapMark ONNX OCR components

on:
  push:
    branches: [snapmark-c2-onnx]
    paths:
      - '.github/workflows/ocr-onnx-engine.yml'
      - 'scripts/ocr-onnx/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr-onnx-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native canvas dependencies on GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install ONNX dependencies on GitHub, never on Code01
        working-directory: scripts/ocr-onnx
        env:
          # ONNX Runtime 1.22 Linux installer incorrectly looks for a Windows
          # CUDA provider path; skip *extra* CUDA downloads, use bundled CPU.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify ONNX runtime components
        working-directory: scripts/ocr-onnx
        run: node worker.cjs --self-test
      - name: Smoke-test real PP-OCRv6 tiny inference on GitHub runner
        shell: bash
        working-directory: scripts/ocr-onnx
        run: |
          set -euo pipefail
          MODEL_ARCHIVE="${RUNNER_TEMP}/snapmark-ppocr-v6-tiny.zip"
          MODEL_EXTRACT="${RUNNER_TEMP}/snapmark-ppocr-v6-tiny-extract"
          MODEL_STAGE="${RUNNER_TEMP}/snapmark-ppocr-v6-tiny-model"
          mkdir -p "$MODEL_EXTRACT" "$MODEL_STAGE"
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/xushengfeng/eSearch-OCR/releases/download/4.0.0/ppocr_v6_tiny.zip' \
            --output "$MODEL_ARCHIVE"
          unzip -t "$MODEL_ARCHIVE" >/dev/null
          unzip -q "$MODEL_ARCHIVE" -d "$MODEL_EXTRACT"
          python3 - "$MODEL_EXTRACT" "$MODEL_STAGE" <<'PYMODEL'
          import shutil, sys
          from pathlib import Path
          src, out = map(Path, sys.argv[1:])
          files = [p for p in src.rglob('*') if p.is_file()]
          for identifier, dest in [('det', 'det.onnx'), ('rec', 'rec.onnx')]:
              candidates = [p for p in files if p.suffix.lower() == '.onnx' and identifier in p.name.lower()]
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one {identifier} ONNX file: {candidates}')
              shutil.copy2(candidates[0], out / dest)
          for p in out.iterdir():
              print('SMOKE_MODEL=', p.name, p.stat().st_size)
          PYMODEL
          # The eSearch v6 tiny release may contain det/rec without any .txt dictionary.
          # PaddleOCR's official PP-OCRv6_tiny_rec.yml requires this specific dictionary.
          curl --fail --location --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/dict/ppocrv6_tiny_dict.txt' \
            --output "$MODEL_STAGE/dict.txt"
          python3 - "$MODEL_STAGE/dict.txt" <<'PYDICT'
          from pathlib import Path
          import sys
          dictionary = Path(sys.argv[1]).read_text(encoding='utf-8-sig')
          chars = dictionary.splitlines()
          if len(chars) != 6904:
              raise SystemExit(f'Invalid PP-OCRv6 tiny dictionary: {len(chars)} entries (expected 6904)')
          # A space or an empty string can be a legitimate OCR dictionary slot.
          # strip() is NOT a valid per-entry test for model vocabulary entries.
          if not any(ch.strip() for ch in chars):
              raise SystemExit('Invalid PP-OCRv6 tiny dictionary: all entries are whitespace')
          print('SNAPMARK_V6_TINY_DICT_WHITESPACE_ENTRIES=', sum(not ch.strip() for ch in chars))
          print('SNAPMARK_V6_TINY_DICT_ENTRIES=', len(chars))
          PYDICT
          node worker.cjs --smoke-test --model-dir "$MODEL_STAGE"
      - name: Prepare portable build candidate
        shell: bash
        run: |
          mkdir -p dist/ocr-onnx-linux-x86_64
          cp "$(command -v node)" dist/ocr-onnx-linux-x86_64/node
          cp -a scripts/ocr-onnx/node_modules dist/ocr-onnx-linux-x86_64/
          cp scripts/ocr-onnx/worker.cjs dist/ocr-onnx-linux-x86_64/
          cp scripts/ocr-onnx/package.json dist/ocr-onnx-linux-x86_64/
          cd dist
          tar -czf SnapMark-OCR-ONNX-linux-x86_64.tar.gz ocr-onnx-linux-x86_64
          sha256sum SnapMark-OCR-ONNX-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SnapMark-OCR-ONNX-linux-x86_64
          path: |
            dist/SnapMark-OCR-ONNX-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
